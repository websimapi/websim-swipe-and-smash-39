<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Swipe and Smash</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "confetti": "https://esm.sh/canvas-confetti@1.9.2",
            "react": "https://esm.sh/react@18.3.1?dev",
            "react-dom": "https://esm.sh/react-dom@18.3.1?dev",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?dev",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime?dev",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime?dev",
            "remotion": "https://esm.sh/remotion@4.0.350?external=react,react-dom&dev",
            "@remotion/player": "https://esm.sh/@remotion/player@4.0.350?external=react,react-dom&dev",
            "@websim/remotion/player": "https://esm.websim.com/@websim/remotion/player",
            "@remotion/transitions": "https://esm.sh/@remotion/transitions@4.0.350?external=react,react-dom,remotion&dev",
            "mediabunny": "https://esm.sh/mediabunny@1.19.1"
        }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <h1>Swipe and Smash</h1>
        <p class="subtitle">Candy Mash</p>
        <div class="info">
            <div id="score-container">Score: <span id="score">0</span></div>
        </div>
        <div id="game-board-container">
            <div id="combo-display"></div>
            <div id="game-board"></div>
            <div id="start-overlay">
                <button id="start-button">Start</button>
            </div>
        </div>
        <div id="game-footer">
            <div id="timer-container">Time: <span id="timer">15</span></div>
            <div id="score-container">Score: <span id="score">0</span></div>
            <div id="clip-button-container">
                <button id="clip-button" aria-label="Show Replay"></button>
            </div>
            <div id="smash-container">
                <div id="smash-button">
                    <div id="smash-fluid"></div>
                    <span id="smash-value">0</span>
                </div>
            </div>
        </div>
    </div>
    <div id="replay-modal" class="hidden">
        <div id="replay-container-wrapper" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative;">
            <div id="remotion-root" style="width: 100%; height: 100%; max-width: 540px; max-height: 960px; display: flex; justify-content: center; align-items: center;"></div>
             <button id="close-replay-button" class="icon-button" style="position: absolute; top: 10px; right: 10px; z-index: 1000;">&times;</button>
        </div>
    </div>
    <script type="module" src="game.js"></script>
    <script type="module" src="main.jsx"></script>

</body>
</html>
